    const _charts = {};
    function renderDonut(id, items) {

      (starStat.examples && starStat.examples.filled || []).forEach(function (e) {

      }

      function payCard(q) {
        const ms = q.metrics || {};
        let res = (q.top_results || []).map(function (r, j) {
          return '<div class="sq-r">'
            + '<div class="sq-rk">' + (j + 1) + '.</div><div class="sq-nm">' + r.name + '</div>'
            + '<div class="sq-ct">' + r.city + '</div>'
            + '<span class="bdg bdg-gr">' + r.type + '</span>'
            + '<span class="bdg bdg-g">' + r.segment + '</span>'
            + '<div style="font-family:monospace;font-size:10px;color:var(--lt);white-space:nowrap">' + r.uuid + '</div>'
            + '</div>';
        }).join('');
        return '<div class="sq"><div class="sq-h">'
          + '<div class="sq-n">' + q.query_num + '</div><div class="sq-t">' + q.description + '</div>'
          + '<div class="sq-ms">'
          + '<div class="sq-m">matched <strong style="color:var(--g)">' + fmtN(ms.total_matched) + '</strong></div>'
          + '<div class="sq-m">total <strong>' + fmtMs(ms.total_ms) + '</strong></div>'
          + '</div></div><div class="sq-body">' + res + '</div></div>';
      }

      const tvId = 'tv-' + m; const tpId = 'tp-' + m;
      setTimeout(function () {
        const tvEl = document.getElementById(tvId);
        const tpEl = document.getElementById(tpId);
        if (tvEl) tvEl.innerHTML = (vt.queries || []).map(vecCard).join('');
        if (tpEl) tpEl.innerHTML = (pt.queries || []).map(payCard).join('');
      }, 0);

      return '<div class="g2" style="margin-bottom:16px">'
        + '<div class="card"><div class="card-h">Векторный поиск</div><div class="card-b">' + vSum + '</div></div>'
        + '<div class="card"><div class="card-h">Payload поиск</div><div class="card-b">' + pSum + '</div></div>'
        + '</div>'
        + '<div class="tabs"><div class="tab on" onclick="sw(this,\'' + tvId + '\')">🔍 Векторный</div>'
        + '<div class="tab" onclick="sw(this,\'' + tpId + '\')">🗂 Payload</div></div>'
        + '<div class="tp on" id="' + tvId + '"></div>'
        + '<div class="tp" id="' + tpId + '"></div>';
    }

    // Main content builder
    function buildContent(m) {
      const us = US(m);
      const meta = R(m).metadata;
      const cfg = MODE_CFG[m];
      const tot = meta.points_analyzed;
      const types = us.type_distribution || [];
      const cities = us.top_cities || [];
      const roomNames = us.top_room_names_normalized || [];
      const hotelAmen = us.top_hotel_amenities || [];
      const roomAmen = us.top_room_amenities || [];
      const aptCities = us.apartments_by_city || [];

      const seg = {};
      (us.segment_distribution || []).forEach(function (s) { seg[s.value] = s.count; });

      // KPI
      const kpiHtml = '<div class="g4" style="margin-bottom:22px">'
        + '<div class="kpi g"><div class="kpi-l">Объектов</div><div class="kpi-v">' + fmtN(tot) + '</div><div class="kpi-s">' + cfg.label + '</div></div>'
        + '<div class="kpi g"><div class="kpi-l">Usual</div><div class="kpi-v">' + fmtN(seg.usual || 0) + '</div><div class="kpi-s">' + fmtP((seg.usual || 0) / tot * 100) + '</div></div>'
        + '<div class="kpi y"><div class="kpi-l">Premium</div><div class="kpi-v">' + fmtN(seg.premium || 0) + '</div><div class="kpi-s">' + fmtP((seg.premium || 0) / tot * 100) + '</div></div>'
        + '<div class="kpi b"><div class="kpi-l">Ultra</div><div class="kpi-v">' + fmtN(seg.ultra || 0) + '</div><div class="kpi-s">' + fmtP((seg.ultra || 0) / tot * 100) + '</div></div>'
        + '</div>';

      // Types
      const typesHtml = '<div class="card"><div class="card-h">Типы размещения</div><div class="card-b">'
        + (types.length ? types.map(function (t) { return bar(t.value, t.pct, fmtN(t.count)); }).join('') : 'Нет данных')
        + '</div></div>';

      // Cities
      const cityRows = cities.slice(0, 20).map(function (c, i) {
        return '<tr><td style="color:var(--lt);font-size:12px">' + (i + 1) + '</td><td><strong>' + c.value + '</strong></td>'
          + '<td class="tr">' + fmtN(c.count) + '</td><td class="tm">' + fmtP(c.pct) + '</td></tr>';
      }).join('');
      const cityBars = cities.slice(0, 20).map(function (c) { return bar(c.value, c.pct, fmtP(c.pct), '#1a7d2c'); }).join('');
      const citiesHtml = '<div class="g2">'
        + '<div class="card"><div class="card-h">Топ-20 городов</div>'
        + '<div style="padding:0"><table><thead><tr><th style="width:28px">#</th><th>Город</th><th class="tr">Объектов</th><th class="tm">Доля</th></tr></thead>'
        + '<tbody>' + cityRows + '</tbody></table></div></div>'
        + '<div class="card"><div class="card-h">Города — бары</div><div class="card-b">' + cityBars + '</div></div>'
        + '</div>';

      // Apt by city
      let aptCityHtml = '';
      if ((m === 'all' || m === 'apartments') && aptCities.length) {
        const aptBars = aptCities.slice(0, 15).map(function (c) { return bar(c.city, c.count / aptCities[0].count * 100, fmtN(c.count)); }).join('');
        aptCityHtml = '<div class="card" style="margin-top:18px"><div class="card-h">Апартаменты — топ городов</div><div class="card-b">' + aptBars + '</div></div>';
      }

      // Stars/segments (conditional)
      const starsHtml = cfg.stars ? starsSection(m) : '';
      const segmentsHtml = cfg.segments ? segmentsSection(m) : '';

      // Rooms
      const roomStat = FSTAT(m).hotel_rooms || {};
      const rq = roomStat.room_quality || {};
      const rc = roomStat.room_count_stats || {};
      const cats = roomStat.categories || {};
      const roomsHtml = '<div class="g2">'
        + '<div class="card"><div class="card-h">Нормализованные названия номеров</div><div class="card-b">'
        + (roomNames.length ? roomNames.map(function (r) { return bar(r.value, r.count / roomNames[0].count * 100, fmtN(r.count)); }).join('') : '<div style="color:var(--mu)">Нет данных</div>')
        + '</div></div>'
        + '<div class="card"><div class="card-h">Качество данных по номерам</div><div class="card-b">'
        + '<div class="sg-row"><span>Объектов с номерами</span><span class="sg-val" style="color:var(--g)">' + fmtP((cats.filled || {}).pct || 0) + '</span></div>'
        + '<div class="sg-row"><span>Пустой список</span><span class="sg-val" style="color:var(--y)">' + fmtP((cats.empty_list || {}).pct || 0) + '</span></div>'
        + '<div class="sg-row"><span>Всего номеров</span><span class="sg-val">' + fmtN(rq.total_rooms) + '</span></div>'
        + '<div class="sg-row"><span>Ср. на объект</span><span class="sg-val">' + ((rc.avg || 0).toFixed(1)) + '</span></div>'
        + '<div class="sg-row"><span>Без room_type</span><span class="sg-val" style="color:var(--y)">' + fmtP(((rq.rooms_without_type) || {}).pct || 0) + '</span></div>'
        + '<div class="sg-row"><span>Без room_amenities</span><span class="sg-val" style="color:var(--y)">' + fmtP(((rq.rooms_without_amenities) || {}).pct || 0) + '</span></div>'
        + '</div></div></div>';

      // Amenities
      let amenHtml = '<div class="g2" style="margin-bottom:16px">'
        + '<div class="card"><div class="card-h">Удобства отеля (топ-15)</div><div class="card-b">'
        + (hotelAmen.length ? hotelAmen.slice(0, 15).map(function (a) { return bar(a.value, a.count / hotelAmen[0].count * 100, fmtN(a.count)); }).join('') : '<div style="color:var(--mu)">Нет данных</div>')
        + '</div></div>'
        + '<div class="card"><div class="card-h">Удобства комнат (топ-15)</div><div class="card-b">'
        + (roomAmen.length ? roomAmen.slice(0, 15).map(function (a) { return bar(a.value, a.count / roomAmen[0].count * 100, fmtN(a.count)); }).join('') : '<div style="color:var(--mu)">Нет данных</div>')
        + '</div></div></div>';
      if (hotelAmen.length) amenHtml += '<div class="card"><div class="card-h">Облако — удобства отеля</div><div class="card-b"><div class="tc">'
        + hotelAmen.map(function (a) { return '<span class="tag">' + a.value + '<span class="cnt">' + fmtN(a.count) + '</span></span>'; }).join('')
        + '</div></div></div>';
      if (roomAmen.length) amenHtml += '<div class="card" style="margin-top:14px"><div class="card-h">Облако — удобства комнат</div><div class="card-b"><div class="tc">'
        + roomAmen.map(function (a) { return '<span class="tag">' + a.value + '<span class="cnt">' + fmtN(a.count) + '</span></span>'; }).join('')
        + '</div></div></div>';

      function sec(n, id, title, body) {
        return '<div id="' + id + '" class="sec"><div class="sec-ttl"><span class="n">' + n + '</span>' + title + '</div>' + body + '</div>';
      }
      let sn = 1;
      let out = sec(sn++, 'overview', 'Обзор', kpiHtml + typesHtml);
      out += sec(sn++, 'cities', 'Города', citiesHtml + aptCityHtml);
      if (cfg.stars) out += sec(sn++, 'stars', 'Звёздность (только hotel)', starsHtml);
      if (cfg.segments) out += sec(sn++, 'segments', 'Сегменты — детализация', segmentsHtml);
      out += sec(sn++, 'rooms', 'Номера', roomsHtml);
      out += sec(sn++, 'amenities', 'Удобства', amenHtml);
      out += sec(sn++, 'photos', 'Фото', photosSection(m));
      out += sec(sn++, 'fill', 'Заполненность полей', fillGrid(m));
      out += sec(sn++, 'search', 'Тестирование поиска', searchSection(m));
      return out;
    }

    // Mode switcher
    const _rendered = {};
    function setMode(m) {
      ACTIVE = m;
      document.querySelectorAll('.mode-btn').forEach(function (b) { b.classList.remove('on'); });
      document.querySelectorAll('.mode-btn').forEach(function (b) {
        if (b.textContent.indexOf(MODE_CFG[m].icon) >= 0) b.classList.add('on');
      });

      if (!_rendered[m]) {
        _rendered[m] = true;
        const panel = document.createElement('div');
        panel.id = 'panel-' + m;
        panel.className = 'mode-panel';
        panel.innerHTML = buildContent(m);
        document.getElementById('main-content').appendChild(panel);
        if (MODE_CFG[m].segments) {
          const us = US(m);
          setTimeout(function () {
            renderDonut('seg-donut-' + m, us.segment_distribution.map(function (s) { return { label: s.value, value: s.count }; }));
          }, 50);
        }
      }

      document.querySelectorAll('.mode-panel').forEach(function (p) { p.classList.remove('on'); });
      document.getElementById('panel-' + m).classList.add('on');

      const cfg = MODE_CFG[m];
      const ns = document.getElementById('nav-stars');
      const nseg = document.getElementById('nav-segments');
      if (ns) ns.style.display = cfg.stars ? '' : 'none';
      if (nseg) nseg.style.display = cfg.segments ? '' : 'none';

      setTimeout(animateBars, 50);
    }

    function sw(el, pid) {
      const parent = el.closest('.sec') || document;
      parent.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('on'); });
      parent.querySelectorAll('.tp').forEach(function (p) { p.classList.remove('on'); });
      el.classList.add('on');
      const target = document.getElementById(pid);
      if (target) target.classList.add('on');
    }

    document.querySelectorAll('#main-nav .nav-a').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        const sec = a.dataset.sec;
        const el = document.getElementById(sec);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        document.querySelectorAll('#main-nav .nav-a').forEach(function (x) { x.classList.remove('on'); });
        a.classList.add('on');
      });
    });

    function animateBars() {
      document.querySelectorAll('.mode-panel.on .br-f,.mode-panel.on .sr-f,.mode-panel.on .fg-bar').forEach(function (el) {
        const w = el.style.width; el.style.width = '0';
        requestAnimationFrame(function () { el.style.transition = 'width .7s cubic-bezier(.4,0,.2,1)'; el.style.width = w; });
      });
    }

    setMode('all');

  </script>
</body>

</html>
